<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess</title>
<style>
  :root {
    --bg: #15171c;
    --panel: #1d2026;
    --line: #2c313a;
    --text: #e8eaed;
    --dim: #9aa2af;
    --light: #e9e2d0;
    --dark: #7a8a99;
    --pick: #f0c419;
    --legal: #4ec9a8;
    --danger: #e8624a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 16px 40px;
  }

  .wrap {
    width: 100%;
    max-width: 920px;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.2px;
  }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }

  .layout {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  /* ---------- the board ---------- */
  .boardwrap { flex: 1 1 420px; min-width: 300px; }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    /* Without this the rows size themselves to whatever is in them, so a row
       holding pieces grows taller than an empty one and the board goes wonky. */
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1 / 1;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    user-select: none;
  }

  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(5.6vw, 38px);
    line-height: 1;
    overflow: hidden;
    cursor: pointer;
    transition: background 90ms linear;
  }
  .sq.light { background: var(--light); }
  .sq.dark  { background: var(--dark); }

  .sq .glyph { position: relative; z-index: 2; pointer-events: none; }
  .sq.w .glyph { color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .sq.b .glyph { color: #16181d; text-shadow: 0 1px 1px rgba(255,255,255,.18); }

  /* the coordinate hints in the corners */
  .sq .coord {
    position: absolute; z-index: 3;
    font-size: 9px; font-weight: 700; opacity: .45;
    pointer-events: none;
  }
  .sq .coord.file { right: 3px; bottom: 2px; }
  .sq .coord.rank { left: 3px; top: 2px; }
  .sq.light .coord { color: #5d6672; }
  .sq.dark  .coord { color: #e9e2d0; }

  /* picked-up piece */
  .sq.picked { background: var(--pick) !important; }

  /* a legal destination: a dot on an empty square, a ring on a capture */
  .sq .hint {
    position: absolute; z-index: 1;
    /* centred on the square itself, not wherever the piece pushes it */
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30%; height: 30%;
    border-radius: 50%;
    background: var(--legal);
    opacity: .75;
    pointer-events: none;
  }
  .sq .hint.capture {
    /* a ring around the piece being taken, kept inside the square */
    width: 80%; height: 80%;
    background: transparent;
    border: 3px solid var(--legal);
    opacity: .9;
  }
  .sq.legal:hover { filter: brightness(1.08); }

  /* king in check */
  .sq.incheck { background: var(--danger) !important; }

  /* ---------- side panel ---------- */
  .side {
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @media (max-width: 720px) { .side { flex: 1 1 100%; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--dim);
    font-weight: 600;
  }

  .turn { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #0007; }
  .dot.white { background: #fff; }
  .dot.black { background: #22252b; }

  .msg { font-size: 13px; margin-top: 7px; min-height: 18px; color: var(--dim); }
  .msg.bad  { color: var(--danger); }
  .msg.good { color: var(--legal); }

  .moves {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px;
    max-height: 190px;
    overflow-y: auto;
    line-height: 1.75;
  }
  .moves .row { display: flex; gap: 8px; }
  .moves .n { color: var(--dim); min-width: 24px; }

  .taken { font-size: 23px; line-height: 1.35; min-height: 30px; word-break: break-all; }
  .taken .none { font-size: 12px; color: var(--dim); }

  button {
    width: 100%;
    background: #272b33;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #323742; }
  button + button { margin-top: 7px; }

  .over {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    padding: 11px;
    border-radius: 6px;
    background: #2a2016;
    border: 1px solid #5a4420;
    color: var(--pick);
  }

  /* ---------- voice ---------- */
  .mic { display: flex; align-items: center; gap: 9px; font-size: 14px; }
  .mic .led {
    width: 11px; height: 11px; border-radius: 50%;
    background: #555b66; flex: 0 0 auto;
  }
  .mic .led.on { background: var(--danger); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .heard {
    font-size: 12px; color: var(--dim); margin-top: 8px;
    min-height: 16px; font-style: italic; word-break: break-word;
  }
  .heard b { color: var(--legal); font-style: normal; }
  .vhelp { font-size: 11.5px; color: var(--dim); margin-top: 9px; line-height: 1.65; }
  .vhelp code {
    background: #2a2e36; padding: 1px 5px; border-radius: 3px;
    font-size: 11px; color: var(--text);
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Terminal Chess Engine</h1>
  <div class="sub">Same C++ engine, drawn in a browser. Click a piece to see where it can go.</div>

  <div class="layout">
    <div class="boardwrap">
      <div class="board" id="board"></div>
    </div>

    <div class="side">
      <div class="card">
        <h2>To play</h2>
        <div class="turn"><span class="dot white" id="dot"></span><span id="turn">White</span></div>
        <div class="msg" id="msg"></div>
      </div>

      <div class="card" id="overCard" style="display:none">
        <div class="over" id="over"></div>
      </div>

      <div class="card">
        <h2>Captured</h2>
        <div class="taken" id="taken"><span class="none">none yet</span></div>
      </div>

      <div class="card">
        <h2>Moves</h2>
        <div class="moves" id="moves"><span style="color:var(--dim);font-size:12px">no moves yet</span></div>
      </div>

      <div class="card" id="voiceCard">
        <h2>Voice</h2>
        <div class="mic"><span class="led" id="led"></span><span id="micState">Off</span></div>
        <div class="heard" id="heard"></div>
        <button id="mic" style="margin-top:10px">Start listening</button>
        <div class="vhelp">
          Say a square to pick a piece up, then another to move it &mdash;
          <code>e2</code> then <code>e4</code>. Or both at once:
          <code>e2 to e4</code>. Also <code>new game</code> and <code>flip</code>.
        </div>
      </div>

      <div class="card">
        <button id="flip">Flip board</button>
        <button id="reset">New game</button>
      </div>
    </div>
  </div>
</div>

<script>
// The browser never knows a single rule of chess. Every question goes to the
// C++ engine: which squares are legal, whether a move was allowed, and
// whether the game has ended.

const GLYPH = {
  K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘', P:'♙',
  k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟'
};

const FILES = ['a','b','c','d','e','f','g','h'];

let state = null;      // the latest board from the server
let picked = null;     // square the player has picked up, e.g. "e2"
let legal = [];        // squares the engine says are legal from there
let flipped = false;
let history = [];      // move list, kept in the browser for display
let taken = [];        // captured pieces, worked out by comparing boards

const $ = id => document.getElementById(id);

function pieceAt(square) {
  if (!state) return null;
  const cell = state.board.find(c => c.square === square);
  return cell ? cell.piece : null;
}

function draw() {
  const board = $('board');
  board.innerHTML = '';

  // Work out the order to draw squares in, so flipping is just a reverse.
  let cells = state.board.slice();
  if (flipped) cells.reverse();

  // Find the king that is in check, so it can be coloured red.
  let checkSquare = null;
  if (state.status === 'check' || state.status === 'checkmate') {
    const wanted = state.turn === 'white' ? 'K' : 'k';
    const found = state.board.find(c => c.piece === wanted);
    if (found) checkSquare = found.square;
  }

  for (const cell of cells) {
    const file = cell.square[0];
    const rank = cell.square[1];
    const fileIndex = FILES.indexOf(file);
    const rankIndex = parseInt(rank, 10) - 1;

    const sq = document.createElement('div');
    sq.className = 'sq ' + (((fileIndex + rankIndex) % 2 === 0) ? 'dark' : 'light');
    sq.dataset.square = cell.square;

    if (cell.piece) {
      sq.classList.add(cell.colour === 'white' ? 'w' : 'b');
      const g = document.createElement('span');
      g.className = 'glyph';
      g.textContent = GLYPH[cell.piece] || cell.piece;
      sq.appendChild(g);
    }

    if (cell.square === picked) sq.classList.add('picked');
    if (cell.square === checkSquare) sq.classList.add('incheck');

    // The green dots. This is the part that comes straight from the engine.
    if (legal.includes(cell.square)) {
      sq.classList.add('legal');
      const hint = document.createElement('span');
      hint.className = 'hint' + (cell.piece ? ' capture' : '');
      sq.appendChild(hint);
    }

    // Coordinate hints along the edges, like a real board.
    const bottomRank = flipped ? '8' : '1';
    const edgeFile = flipped ? 'a' : 'h';
    if (rank === bottomRank) {
      const c = document.createElement('span');
      c.className = 'coord file'; c.textContent = file;
      sq.appendChild(c);
    }
    if (file === edgeFile) {
      const c = document.createElement('span');
      c.className = 'coord rank'; c.textContent = rank;
      sq.appendChild(c);
    }

    sq.addEventListener('click', () => clickSquare(cell.square));
    board.appendChild(sq);
  }

  // Side panel
  $('turn').textContent = state.turn === 'white' ? 'White' : 'Black';
  $('dot').className = 'dot ' + state.turn;

  const finished = state.status === 'checkmate' || state.status === 'stalemate';
  $('overCard').style.display = finished ? 'block' : 'none';
  if (state.status === 'checkmate') {
    const winner = state.turn === 'white' ? 'Black' : 'White';
    $('over').textContent = 'Checkmate — ' + winner + ' wins';
  } else if (state.status === 'stalemate') {
    $('over').textContent = 'Stalemate — a draw';
  }

  if (state.status === 'check' && !finished) {
    say((state.turn === 'white' ? 'White' : 'Black') + ' is in check.', 'bad');
  }

  drawMoves();
  drawTaken();
}

function drawMoves() {
  const box = $('moves');
  if (history.length === 0) {
    box.innerHTML = '<span style="color:var(--dim);font-size:12px">no moves yet</span>';
    return;
  }
  box.innerHTML = '';
  for (let i = 0; i < history.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="n">' + (i / 2 + 1) + '.</span>' +
                    '<span>' + history[i] + '</span>' +
                    '<span>' + (history[i + 1] || '') + '</span>';
    box.appendChild(row);
  }
  box.scrollTop = box.scrollHeight;
}

function drawTaken() {
  const box = $('taken');
  if (taken.length === 0) {
    box.innerHTML = '<span class="none">none yet</span>';
    return;
  }
  box.textContent = taken.map(p => GLYPH[p] || p).join('');
}

function say(text, kind) {
  const m = $('msg');
  m.textContent = text || '';
  m.className = 'msg' + (kind ? ' ' + kind : '');
}

async function clickSquare(square) {
  if (!state) return;
  if (state.status === 'checkmate' || state.status === 'stalemate') return;

  // Second click: if it is one of the lit squares, play the move.
  if (picked && legal.includes(square)) {
    await play(picked + square);
    return;
  }

  // Clicking the same square again puts the piece back down.
  if (picked === square) {
    picked = null; legal = []; draw(); return;
  }

  // First click: ask the engine which squares are legal from here.
  const res = await fetch('/moves?from=' + square);
  const squares = await res.json();

  if (squares.length === 0) {
    picked = null; legal = [];
    const p = pieceAt(square);
    if (p) say('That piece has no legal moves.', 'bad');
    else say('');
    draw();
    return;
  }

  picked = square;
  legal = squares;
  say('');
  draw();
}

async function play(moveText) {
  const before = state.board.slice();

  const res = await fetch('/move', { method: 'POST', body: moveText });
  const result = await res.json();

  if (!result.ok) {
    say(result.reason, 'bad');
    picked = null; legal = [];
    draw();
    return;
  }

  // Work out whether something was captured, by comparing the two boards.
  const after = result.state.board;
  for (let i = 0; i < before.length; i++) {
    const was = before[i].piece;
    const now = after[i].piece;
    if (was && now !== was) {
      // something left this square; only count it if it was taken, which is
      // true when the destination square is the one that changed owner
      if (before[i].square === moveText.slice(2, 4)) taken.push(was);
    }
  }

  history.push(moveText.slice(0, 2) + '–' + moveText.slice(2, 4));

  state = result.state;
  picked = null;
  legal = [];
  say('');
  draw();
}

async function load() {
  const res = await fetch('/state');
  state = await res.json();
  draw();
}

$('flip').addEventListener('click', () => { flipped = !flipped; draw(); });

$('reset').addEventListener('click', async () => {
  const res = await fetch('/reset', { method: 'POST' });
  state = await res.json();
  picked = null; legal = []; history = []; taken = [];
  say('New game.', 'good');
  draw();
});

// ---------------------------------------------------------------
// Voice control.
// The browser does the listening. All we have to do is turn what it
// heard into squares, then reuse exactly the same functions a mouse
// click uses. The C++ engine is not involved and does not change: it
// still only ever answers whether a move is legal.
// ---------------------------------------------------------------

// Speech recognition hears single letters badly, so every sensible way of
// saying a file or a rank is listed here. "see" is c, "ate" is 8, and the
// NATO words work too because they are far easier to hear correctly.
var FILE_WORD = {
  a:'a', ay:'a', eh:'a', hey:'a', alpha:'a', alfa:'a',
  b:'b', be:'b', bee:'b', bravo:'b',
  c:'c', see:'c', sea:'c', si:'c', charlie:'c',
  d:'d', dee:'d', de:'d', delta:'d',
  e:'e', ee:'e', echo:'e',
  f:'f', ef:'f', eff:'f', foxtrot:'f',
  g:'g', gee:'g', jee:'g', golf:'g',
  h:'h', aitch:'h', age:'h', hotel:'h', hitch:'h', edge:'h'
};

var RANK_WORD = {
  '1':'1', one:'1', won:'1',
  '2':'2', two:'2', to:'2', too:'2',
  '3':'3', three:'3', tree:'3',
  '4':'4', four:'4', 'for':'4', fore:'4',
  '5':'5', five:'5',
  '6':'6', six:'6', sicks:'6',
  '7':'7', seven:'7',
  '8':'8', eight:'8', ate:'8', ait:'8'
};

// Pulls the squares out of whatever was heard. "e2 to e4", "e two e four"
// and "echo two echo four" all come out as ["e2","e4"].
function extractSquares(text) {
  var words = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/);
  var stream = '';

  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (!w) continue;

    // already a square such as "e4", or two stuck together such as "e2e4"
    if (/^[a-h][1-8]$/.test(w) || /^([a-h][1-8]){2}$/.test(w)) {
      stream += w;
      continue;
    }
    if (FILE_WORD[w] !== undefined) { stream += FILE_WORD[w]; continue; }
    if (RANK_WORD[w] !== undefined) { stream += RANK_WORD[w]; continue; }
  }

  return stream.match(/[a-h][1-8]/g) || [];
}

var recog = null;
var listening = false;

function setMic(on) {
  listening = on;
  $('led').className = 'led' + (on ? ' on' : '');
  $('micState').textContent = on ? 'Listening' : 'Off';
  $('mic').textContent = on ? 'Stop listening' : 'Start listening';
}

function showHeard(text, squares) {
  if (!text) { $('heard').innerHTML = ''; return; }
  var found = (squares && squares.length)
      ? '  \u2192  <b>' + squares.join(' ') + '</b>' : '';
  $('heard').innerHTML = '\u201c' + text + '\u201d' + found;
}

async function handleSpeech(text) {
  var lower = text.toLowerCase();

  // spoken commands first
  if (lower.indexOf('new game') >= 0 || lower.indexOf('reset') >= 0 ||
      lower.indexOf('restart') >= 0) {
    showHeard(text, []);
    $('reset').click();
    return;
  }
  if (lower.indexOf('flip') >= 0 || lower.indexOf('rotate') >= 0) {
    showHeard(text, []);
    flipped = !flipped;
    draw();
    say('Board flipped.', 'good');
    return;
  }

  var squares = extractSquares(text);
  showHeard(text, squares);

  if (squares.length === 0) {
    say('I did not catch a square. Try saying "e2 to e4".', 'bad');
    return;
  }

  // Two squares is a whole move. One square behaves exactly like a click,
  // so saying "e2" picks the pawn up and saying "e4" afterwards moves it.
  await clickSquare(squares[0]);
  if (squares.length >= 2) {
    await clickSquare(squares[1]);
  }
}

function startVoice() {
  var Engine = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Engine) {
    say('This browser cannot listen. Use Chrome or Edge.', 'bad');
    return;
  }

  recog = new Engine();
  recog.lang = 'en-IN';          // change to en-US if that hears you better
  recog.continuous = true;
  recog.interimResults = false;

  recog.onresult = function (e) {
    var said = e.results[e.results.length - 1][0].transcript.trim();
    handleSpeech(said);
  };

  recog.onerror = function (e) {
    if (e.error === 'not-allowed') {
      say('Microphone blocked. Allow it from the address bar.', 'bad');
      setMic(false);
    }
  };

  // The browser stops listening by itself after a pause, so start it again.
  recog.onend = function () {
    if (listening) {
      try { recog.start(); } catch (err) { /* already starting */ }
    }
  };

  recog.start();
  setMic(true);
  say('Listening. Say a square.', 'good');
}

function stopVoice() {
  setMic(false);
  if (recog) {
    try { recog.stop(); } catch (err) { /* already stopped */ }
  }
  say('');
}

$('mic').addEventListener('click', function () {
  if (listening) { stopVoice(); } else { startVoice(); }
});

// If the browser has no speech support at all, say so instead of
// offering a button that cannot work.
if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
  $('micState').textContent = 'Not supported';
  $('mic').disabled = true;
  $('heard').textContent = 'Voice needs Chrome or Edge.';
}

load();
</script>
</body>
</html>
